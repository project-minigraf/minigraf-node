[package]
name = "minigraf-node"
version = "1.1.1"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.8", features = ["napi6"] }
napi-derive = "3"
# Unreleased v3 core (format v8). Switches to minigraf = "=3.0.0" at the v3.0.0 release.
minigraf = { git = "https://github.com/project-minigraf/minigraf", rev = "97cd4a2a85301ea3478250dd654139d45a1f7cd0" }
serde_json = "1.0"

[build-dependencies]
napi-build = "2.1"

[workspace]
members = ["."]
