name: Node.js Release

on:
  repository_dispatch:
    types: [core-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v1.2.0)'
        required: true
        type: string

jobs:
  prepare:
    name: Pin version, commit, tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      semver: ${{ steps.ver.outputs.semver }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MINIGRAF_RELEASE_TOKEN }}

      - id: ver
        run: |
          V="${{ github.event.client_payload.version || github.event.inputs.version }}"
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          echo "semver=${V#v}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - name: Wait for minigraf ${{ steps.ver.outputs.semver }} on crates.io
        run: |
          SEMVER="${{ steps.ver.outputs.semver }}"
          echo "Waiting for minigraf@$SEMVER on crates.io..."
          for i in $(seq 1 20); do
            STATUS=$(curl -s "https://crates.io/api/v1/crates/minigraf/$SEMVER" \
              -H "User-Agent: minigraf-binding/1.0" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(d.get('version',{}).get('num',''))" 2>/dev/null || echo "")
            if [ "$STATUS" = "$SEMVER" ]; then
              echo "minigraf@$SEMVER is live (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/20: not yet available, waiting 15s..."
            sleep 15
          done
          echo "ERROR: minigraf@$SEMVER not found on crates.io after 5 minutes" >&2
          exit 1
      - name: Pin minigraf version in Cargo.toml
        run: |
          sed -i 's/^minigraf = "[^"]*"/minigraf = "=${{ steps.ver.outputs.semver }}"/' Cargo.toml
          sed -i 's/\(minigraf = {[^}]*version = \"\)[^\"]*/\1=${{ steps.ver.outputs.semver }}/' Cargo.toml

      - name: Update Cargo.lock
        run: cargo update --precise "${{ steps.ver.outputs.semver }}" minigraf

      # Push the pin commit to a throwaway branch only. The tag and main are
      # updated by the tag job, after the test job has passed on this commit.
      - name: Commit and push release branch
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: release ${{ steps.ver.outputs.tag }}"
          else
            echo "Cargo.toml already pinned, skipping commit"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push --force origin "HEAD:refs/heads/release/${{ steps.ver.outputs.tag }}"

  # Run this binding's test suite against the exact pinned core version before
  # anything becomes visible: no tag, no main update, no publish until it passes.
  test:
    name: Test pinned release
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      # The tarballs are built and consumer-tested here at the release
      # version; publish uploads exactly these files.
      version: ${{ needs.prepare.outputs.semver }}

  tag:
    name: Push tag and update main
    needs: [prepare, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          token: ${{ secrets.MINIGRAF_RELEASE_TOKEN }}
          # Parent commit (= main) so git can verify the main push is a fast-forward.
          fetch-depth: 2

      - name: Push tag, fast-forward main, delete release branch
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          EXISTING=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [ -z "$EXISTING" ]; then
            REFS=("$SHA:refs/heads/main" "$SHA:refs/tags/$TAG")
          elif [ "$EXISTING" = "$SHA" ]; then
            echo "Tag $TAG already points at $SHA, skipping tag push"
            REFS=("$SHA:refs/heads/main")
          else
            echo "::error::Tag $TAG already exists at $EXISTING, but the tested commit is $SHA. Delete the tag and re-run to release the tested commit."
            exit 1
          fi
          # Atomic: main and the tag move together or not at all. Rejected if
          # main moved during the release; re-run to re-pin on the new main.
          git push --atomic origin "${REFS[@]}"
          git push origin --delete "release/$TAG" \
            || echo "::warning::Could not delete branch release/$TAG"

  publish:
    name: Publish to npm
    needs: [prepare, test, tag]
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/minigraf
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v4
        with:
          name: dist-npm
          path: dist

      # Re-runs are expected (e.g. after a partial failure), so a version that is
      # already on npm is skipped, not treated as an error. Any other npm failure
      # fails the job. The job summary says which packages were actually published.
      # Platform packages first, so the root's optionalDependencies resolve.
      - name: Publish the tested tarballs
        env:
          VERSION: ${{ needs.prepare.outputs.semver }}
        run: |
          echo "## npm publish — $VERSION" >> "$GITHUB_STEP_SUMMARY"
          [ "$(ls dist | wc -l)" -eq 5 ] || { echo "::error::expected 5 tarballs"; exit 1; }
          publish() {
            local tgz="$1" name
            name=$(tar xOzf "$tgz" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).name")
            if [ "$(npm view "$name@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "::warning::$name@$VERSION is already on npm; skipping"
              echo "- \`$name@$VERSION\` — already published, skipped" >> "$GITHUB_STEP_SUMMARY"
            else
              npm publish "$tgz" --access public
              echo "- \`$name@$VERSION\` — published" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          for tgz in dist/minigraf-*-"$VERSION".tgz; do
            publish "$tgz"
          done
          publish "dist/minigraf-$VERSION.tgz"

  # Installs the published version from npm and runs the consumer test; on
  # failure the run fails and a release-broken issue is opened.
  verify-published:
    name: Verify the published packages
    needs: [prepare, publish]
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/verify-published.yml
    with:
      version: ${{ needs.prepare.outputs.semver }}
      ref: ${{ needs.prepare.outputs.tag }}
